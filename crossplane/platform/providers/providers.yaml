---
# DeploymentRuntimeConfig pins the ServiceAccount name to a stable value
# (default behaviour appends a random hash), so the ClusterRoleBinding below
# stays valid across reinstalls/upgrades.
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
---
# provider-sql speaks to PostgreSQL (and MySQL, MSSQL) as a Crossplane provider.
# We use it for: Database, Role, Grant, Schema. Tables are handled via Jobs
# in provider-kubernetes because provider-sql doesn't model arbitrary DDL.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-sql
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-sql:v0.11.0
---
# provider-kubernetes lets us compose arbitrary K8s objects (Secrets, Jobs,
# ConfigMaps) from a Crossplane XR. We use it to create the per-XR Job that
# runs CREATE TABLE statements against Postgres.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v0.18.0
  runtimeConfigRef:
    name: provider-kubernetes
