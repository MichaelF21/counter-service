---
apiVersion: v1
kind: Namespace
metadata:
  name: db
  labels:
    # Postgres needs a few caps that `restricted` blocks; use `baseline` here.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
# Superuser credentials. In prod this would be an ExternalSecret synced from
# AWS Secrets Manager. For the assignment we generate it inline; rotation is
# documented as a follow-up.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-superuser
  namespace: db
type: Opaque
stringData:
  # 32-char alphanumeric, generated once and pinned for the demo. Treat as
  # equivalent to a sealed-secret value — not for real prod.
  POSTGRES_PASSWORD: "ChangeMe-counterDemoSuperPass-2026"
  POSTGRES_USER: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: db
data:
  # Tighten auth so provider-sql can connect via password from inside the cluster.
  postgresql.conf: |
    listen_addresses = '*'
    max_connections = 100
    shared_buffers = 64MB
  pg_hba.conf: |
    local   all all                                  trust
    host    all all 127.0.0.1/32                     scram-sha-256
    host    all all ::1/128                          scram-sha-256
    host    all all 10.42.0.0/16                     scram-sha-256
    host    all all all                              scram-sha-256
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: db
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: tcp
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: db
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: POSTGRES_USER
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 500m, memory: 384Mi }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests: { storage: 1Gi }
