[project]
name = "counter-service"
version = "0.1.0"
description = "Nano counter service: counts POST requests, returns count on GET. Built for the Check Point DevOps home assignment."
requires-python = ">=3.13"
dependencies = [
    # Bumped from 0.115.6: needed to pull starlette >=0.49.1 (CVE-2025-62727).
    # FastAPI capped starlette <0.49 until 0.122; pin a version that allows it.
    "fastapi==0.122.0",
    "starlette>=0.49.1",
    "uvicorn[standard]==0.34.0",
    "redis==5.2.0",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "python-json-logger==3.2.1",
    "prometheus-client==0.21.1",
    # asyncpg drives the optional /ingest endpoint that writes into the
    # Crossplane-provisioned Postgres table. Lazy: only initialised if
    # COUNTER_INGEST_ENABLED=true.
    "asyncpg==0.30.0",
    # async-timeout only needed for Python <3.11.3 where redis-py imports it
    # unconditionally; with 3.13 we can drop it.
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "fakeredis==2.26.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --cov=app --cov-report=term-missing --cov-fail-under=90"
