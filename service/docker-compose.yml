services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  counter-service:
    build:
      context: .
      args:
        APP_VERSION: "0.1.0-compose"
    ports:
      - "8090:8080"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      COUNTER_BACKEND: redis
      COUNTER_REDIS_URL: redis://redis:6379/0
      COUNTER_LOG_LEVEL: INFO

volumes:
  redis-data:
