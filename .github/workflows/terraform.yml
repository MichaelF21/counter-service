name: terraform

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        type: choice
        description: "What to do"
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write
  pull-requests: write   # for posting plan comments

env:
  AWS_REGION: eu-west-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan
    # Always run plan on PR/push, AND whenever workflow_dispatch is used
    # (apply needs plan as a dependency, so skipping plan would skip apply too).
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The TF helm provider does not run `helm repo update` — without a cached
      # index it errors with "no cached repo found". Pre-populating is the fix
      # documented by hashicorp/terraform-provider-helm.
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Prime helm repo cache
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -out=tfplan -no-color

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: infra/envs/prod/tfplan
          retention-days: 7

  apply:
    name: Apply
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.inputs.action == 'apply'
    needs: plan
    runs-on: ubuntu-latest
    environment: prod   # protect with required reviewers in repo settings
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Prime helm repo cache
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server
          helm repo add external-secrets https://charts.external-secrets.io
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      - name: terraform init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: terraform apply
        run: terraform apply -auto-approve
