apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base
  - ingest-netpol.yaml   # NetworkPolicy allowing counter-service -> postgres

# Argo CD image-updater rewrites the tag below on every push to main.
# Local kubectl apply will fall back to ":latest" — only used for dev/test.
images:
  - name: counter-service
    newName: 630943284793.dkr.ecr.eu-west-2.amazonaws.com/counter-service-prod
    newTag: 72641a85d80854715d890c336032c5a98340ec21

labels:
  - pairs:
      app.kubernetes.io/version: "0.2.0"
      app.kubernetes.io/environment: prod

patches:
  - target:
      kind: Deployment
      name: counter-service
    patch: |-
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1version
        value: "0.2.0"
  - target:
      kind: Deployment
      name: counter-service
    path: ingest-env-patch.yaml
