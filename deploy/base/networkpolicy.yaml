---
# Default-deny ingress for the prod namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress traffic to counter-service from the ALB controller, Prometheus, and same-namespace clients.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: counter-service-ingress
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: counter-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        # ALB target-type=ip → traffic appears to come from the node IPs in the VPC CIDR.
        # We intentionally allow all sources to port 8080 because the ALB does the public termination.
        # Tighten this with the VPC CIDR if running in a private VPC where the ALB is internal.
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
---
# Allow ingress to Redis from counter-service only (default-deny applies otherwise).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: counter-redis-ingress
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: counter-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: counter-service
      ports:
        - protocol: TCP
          port: 6379
---
# Allow egress from counter-service to Redis and DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: counter-service-egress
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: counter-service
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: counter-redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
