---
# Redis ConfigMap: AOF on with everysec fsync — survives crash with at most 1s data loss.
apiVersion: v1
kind: ConfigMap
metadata:
  name: counter-redis-config
  namespace: prod
data:
  redis.conf: |
    appendonly yes
    appendfsync everysec
    save 60 1
    save 300 10
    save 900 100
    dir /data
    maxmemory 96mb
    maxmemory-policy noeviction
    protected-mode no
    bind 0.0.0.0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: counter-redis
  namespace: prod
  labels:
    app.kubernetes.io/name: counter-redis
    app.kubernetes.io/component: cache
spec:
  serviceName: counter-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: counter-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: counter-redis
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/redis
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: counter-redis-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # gp3 storageclass is created by Terraform; encrypted with KMS per default storageclass config.
        storageClassName: gp3
        resources:
          requests:
            storage: 1Gi
