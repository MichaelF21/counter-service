apiVersion: v1
kind: Service
metadata:
  name: counter-redis
  namespace: prod
  labels:
    app.kubernetes.io/name: counter-redis
spec:
  type: ClusterIP
  clusterIP: None  # headless, required for StatefulSet stable DNS
  selector:
    app.kubernetes.io/name: counter-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
