apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml
  - redis/redis-statefulset.yaml
  - redis/redis-service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: counter-service
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true

images:
  - name: counter-service
    newName: counter-service
    newTag: latest
